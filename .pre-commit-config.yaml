# Pre-commit configuration for toolate28/kenl
default_stages: [commit]
minimum_pre_commit_version: '2.20.0'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets

  - repo: https://github.com/koalaman/shellcheck
    rev: v0.10.0
    hooks:
      - id: shellcheck
        name: shellcheck
        files: '\.(sh|bash)$'
        args: ['--severity', 'style', '--external-sources']

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.103.0
    hooks:
      - id: terraform_fmt
        files: '\.(tf|tfvars)$'

  # Optional Python linters/formatters - enable if repo adds or grows Python code
