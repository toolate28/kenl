## Rollback

**If cleanup archives something important:**

```bash
# List recent archives
ls -la .archive/sessions/$(date +%Y-%m)/

# Restore specific file
mv .archive/sessions/2025-12/ATOM-DIRECTIVE-20251205-001.md ./

# Restore entire archive
mv .archive/sessions/2025-12/* ./
```

