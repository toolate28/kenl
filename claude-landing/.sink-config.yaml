## Agent Workflow

### On Session Start
```bash
# Read counter
if [ ! -f .sink-counter ]; then
    # Initialize counter
    cat > .sink-counter <<EOF
LAST_CLEANUP=$(date +%Y-%m-%d)
FILE_COUNT=$(ls -1 *.md | wc -l)
ARCHIVABLE_COUNT=0
CLEANUP_THRESHOLD=50
EOF
fi

# Check if cleanup needed
source .sink-counter
CURRENT_COUNT=$(ls -1 *.md | wc -l)

if [ $CURRENT_COUNT -gt $CLEANUP_THRESHOLD ]; then
    echo "⚠️  Sink cleanup recommended ($CURRENT_COUNT files > $CLEANUP_THRESHOLD threshold)"
    echo "Run: ./cleanup-sink.sh"
fi
```

### During Session
**Agent automatically categorizes new files:**

- Writing directive? → Use `ATOM-DIRECTIVE-YYYYMMDD-NNN.md`
- Session notes? → Use `SESSION-YYYY-MM-DD-<topic>.md`
- Analysis? → Use `<topic>-analysis-YYYYMMDD.md`
- Updating system docs? → Use anchored name (no ATOM/date)

### On Session End
```bash
# Update counter
FILE_COUNT=$(ls -1 *.md | wc -l)
ARCHIVABLE_COUNT=$(ls -1 ATOM-*.md SESSION-*.md 2>/dev/null | wc -l)

cat > .sink-counter <<EOF
LAST_CLEANUP=$LAST_CLEANUP
FILE_COUNT=$FILE_COUNT
ARCHIVABLE_COUNT=$ARCHIVABLE_COUNT
CLEANUP_THRESHOLD=50
EOF
```

