# Agent Documentation Sink Configuration

## Purpose

Automated cleanup and archival system for agent-generated documentation. Keeps claude-landing/ directory clean and organized without manual intervention.

---

## Naming Conventions

### Anchored Files (NEVER Archive)
**Pattern:** No ATOM tag in filename

These are **system-critical** or **hand-curated** documents that should remain permanently:

- `CURRENT-STATE.md` - Current environment snapshot
- `RECENT-WORK.md` - Recent session summary
- `NEXT-STEPS.md` - Immediate tasks
- `QUICK-REFERENCE.md` - Common commands
- `AI-AGENT-SYSTEM.md` - Agent framework
- `DOCUMENTATION-PATHWAYS.md` - Navigation hub
- `README.md` - Sink overview
- Any file matching: `^[A-Z][A-Z-]+\.md$` (no date, no ATOM)

### Auto-Archive Files (Cleanup Eligible)
**Pattern:** Contains ATOM tag or date in filename

These are **agent-generated** or **session-specific** documents:

- `ATOM-DIRECTIVE-DUALBOOT-20241127-001.md` - Specific directive
- `SESSION-2025-11-17-LOGDY-SAIF-COMPLETE.md` - Session notes
- `context-sync-vs-kenl-comparison.md` - Analysis (stale after implementation)
- `kenl-atom-visual-presentation.md` - Generated presentation

**Patterns:**
- `ATOM-*-YYYYMMDD-NNN.md`
- `SESSION-YYYY-MM-DD-*.md`
- `*-analysis.md`
- `*-assessment.md`
- `*-comparison.md`
- Files older than `MAX_AGE_DAYS`

---

## Counter System

### Counter File
**Location:** `claude-landing/.sink-counter`

```
LAST_CLEANUP=2025-12-05
FILE_COUNT=32
ARCHIVABLE_COUNT=12
CLEANUP_THRESHOLD=50
```

### Automatic Triggers

| Trigger | Threshold | Action |
|---------|-----------|--------|
| File count > 50 | `FILE_COUNT > CLEANUP_THRESHOLD` | Initiate cleanup |
| Archivable > 30% | `ARCHIVABLE_COUNT / FILE_COUNT > 0.3` | Suggest cleanup |
| Days since cleanup > 30 | `TODAY - LAST_CLEANUP > 30` | Routine maintenance |

---

## Cleanup Operations

### Phase 1: Identify (Automatic)
```bash
# Agent reads directory
find . -name "ATOM-*.md" -o -name "SESSION-*.md"
find . -name "*-analysis.md" -o -name "*-assessment.md"

# Check file ages
find . -name "*.md" -mtime +90  # Older than 90 days
```

### Phase 2: Spot Check (Semi-Automatic)
**Random 2% audit** of files to be archived:

```bash
# Select 2% random sample for review
TOTAL=$(ls ATOM-*.md SESSION-*.md | wc -l)
SAMPLE_SIZE=$((TOTAL * 2 / 100))
ls ATOM-*.md SESSION-*.md | shuf -n $SAMPLE_SIZE
```

**Agent reviews sample:**
- ✅ Confirms safe to archive
- ⚠️ Flags any that should stay
- 🔒 Marks exceptions as "anchor" (rename to remove ATOM/date)

### Phase 3: Archive (Automatic)
```bash
# Create dated archive directory
ARCHIVE_DIR=".archive/sessions/$(date +%Y-%m)"
mkdir -p "$ARCHIVE_DIR"

# Move eligible files
mv ATOM-*.md "$ARCHIVE_DIR/"
mv SESSION-*.md "$ARCHIVE_DIR/"

# Update counter
echo "LAST_CLEANUP=$(date +%Y-%m-%d)" > .sink-counter
```

---

## Archival Rules

### Always Archive (After 90 days)
- `ATOM-DIRECTIVE-*` - Completed directives
- `ATOM-ANALYSIS-*` - Completed analyses
- `ATOM-RESEARCH-*` - Research results
- `SESSION-*` - Session notes
- `*-comparison.md` - Comparisons (after decision made)

### Never Archive (Anchored)
- `CURRENT-STATE.md` - Always current
- `RECENT-WORK.md` - Rolling window
- `NEXT-STEPS.md` - Active tasks
- `QUICK-REFERENCE.md` - Reference material
- `AI-AGENT-SYSTEM.md` - Framework docs
- `DOCUMENTATION-PATHWAYS.md` - Navigation
- `README.md` - Sink documentation

### Maybe Archive (Manual Review)
- `HARDWARE.md` - Stable until hardware changes
- `MIGRATION-PLAN.md` - Active until migration complete
- `TESTING-RESULTS.md` - Depends on relevance
- Files without clear ATOM tag or date pattern

