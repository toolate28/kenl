## Cleanup Script Interface

**Location:** `claude-landing/cleanup-sink.sh`

```bash
#!/usr/bin/env bash
# Sink cleanup with spot-check audit

MODE=${1:-preview}  # preview, audit, execute

case $MODE in
    preview)
        echo "📋 Preview Mode - Files eligible for archive:"
        find . -maxdepth 1 \( -name "ATOM-*.md" -o -name "SESSION-*.md" \) -mtime +90
        ;;
    audit)
        echo "🔍 Audit Mode - Random 2% sample for review:"
        find . -maxdepth 1 \( -name "ATOM-*.md" -o -name "SESSION-*.md" \) -mtime +90 | shuf -n 2
        echo ""
        echo "Review these files. Are they safe to archive? (y/n)"
        ;;
    execute)
        echo "🗂️  Execute Mode - Archiving files..."
        ARCHIVE_DIR=".archive/sessions/$(date +%Y-%m)"
        mkdir -p "$ARCHIVE_DIR"
        find . -maxdepth 1 \( -name "ATOM-*.md" -o -name "SESSION-*.md" \) -mtime +90 -exec mv {} "$ARCHIVE_DIR/" \;
        echo "✅ Archived to $ARCHIVE_DIR"
        echo "LAST_CLEANUP=$(date +%Y-%m-%d)" >> .sink-counter
        ;;
esac
```

