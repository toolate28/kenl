## Examples

### Good Naming (Anchored)
```
✅ CURRENT-STATE.md           # System critical
✅ AI-AGENT-SYSTEM.md          # Framework doc
✅ QUICK-REFERENCE.md          # Reference material
✅ DOCUMENTATION-PATHWAYS.md   # Navigation
✅ HARDWARE.md                 # Stable reference
```

### Good Naming (Auto-Archive)
```
✅ ATOM-DIRECTIVE-20251205-001.md       # Specific directive
✅ SESSION-2025-12-05-module-refactor.md # Session notes
✅ context-sync-analysis-20251127.md     # Completed analysis
✅ gpu-hang-assessment-DRAFT.md          # Temporary analysis
```

### Bad Naming (Ambiguous)
```
❌ important-doc.md              # No clear category
❌ notes.md                      # Too generic
❌ stuff-from-tuesday.md         # Unclear lifecycle
```

**Fix:** Either anchor (no ATOM) or add ATOM/date tag

