## Launch Configuration

### Steam Launch Command

```bash
steam -applaunch 1790600
```

### Optimized Launch Script

**Location:** `~/.kenl/steam-game-1790600-launch.sh`

**Environment Variables:**
```bash
RADV_PERFTEST=gpl,nggc,sam        # AMD RADV optimizations
AMD_VULKAN_ICD=RADV               # Force RADV driver
PROTON_ENABLE_NVAPI=0             # Disable NVIDIA API
PROTON_HIDE_NVIDIA_GPU=1          # Hide NVIDIA GPU detection
mangohud                           # Enable FPS overlay
```

### GameScope Settings (Optional)

```bash
gamescope -W 1920 -H 1080 -r 60 -F fsr -f \
  -- steam -applaunch 1790600
```

**Parameters:**
- `-W 1920 -H 1080`: Native 1080p resolution
- `-r 60`: 60Hz refresh rate
- `-F fsr`: AMD FidelityFX Super Resolution upscaling
- `-f`: Fullscreen mode

