## Troubleshooting

### Common Issues

**1. Game won't launch:**
```bash
# Check Proton version
# Steam → Game Properties → Compatibility
# Force specific Proton version (GE-Proton recommended)
```

**2. Low FPS:**
```bash
# Verify CPU governor is 'performance'
cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor

# Check GPU power profile
cat /sys/class/drm/card0/device/power_dpm_force_performance_level
```

**3. Vulkan errors:**
```bash
# Verify RADV driver
vulkaninfo --summary | grep deviceName

# Should show: AMD Radeon Vega + RADV
```

**4. MangoHud not showing:**
```bash
# Check MangoHud installation
flatpak list | grep MangoHud

# Force enable
MANGOHUD=1 steam -applaunch 1790600
```

