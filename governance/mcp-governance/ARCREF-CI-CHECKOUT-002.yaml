notes: |
  This upgrade is part of GitHub's ecosystem-wide migration to Node.js 24 for
  GitHub Actions. The actions/checkout v5 release (2024-11-18) ensures compatibility
  with the latest GitHub-hosted runners and prepares the repository for future
  runtime updates.

  Key Rationale:
  1. **Consistency**: All workflows use the same checkout version
  2. **Future-Proofing**: Node.js 24 support for upcoming runner updates
  3. **Best Practice**: Keep dependencies current for security and compatibility
  4. **Zero Risk**: Backward-compatible upgrade with no configuration changes

  Files Modified:
  - .github/workflows/ci.yml (3 instances: lines 25, 33, 44)
  - .github/workflows/cloudflare-deploy.yml (5 instances: lines 29, 50, 90, 125, 187)
  - .github/workflows/release.yml (1 instance: line 23)
  - .github/workflows/validate.yml (3 instances: lines 15, 24, 37)

  Total: 12 instances across 4 workflow files

