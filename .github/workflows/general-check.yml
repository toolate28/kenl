name: General Code Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  yaml-json-validation:
    name: YAML/JSON Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install validators
        run: pip install yamllint

      - name: Validate YAML files
        run: |
          echo "🔍 Validating YAML files..."
          # Find all YAML files
          yaml_files=$(find . -type f \( -name "*.yaml" -o -name "*.yml" \) \
            ! -path "./.git/*" \
            ! -path "./node_modules/*" \
            ! -path "./vendor/*")

          if [ -n "$yaml_files" ]; then
            # Create relaxed yamllint config
            cat > /tmp/.yamllint.yml << 'EOF'
          extends: relaxed
          rules:
            line-length:
              max: 200
              allow-non-breakable-inline-mappings: true
            truthy:
              allowed-values: ['true', 'false', 'yes', 'no', 'on', 'off']
          EOF
            yamllint -c /tmp/.yamllint.yml $yaml_files || {
              echo "⚠️  YAML validation found issues (non-blocking)"
              # TODO: Make blocking once YAML files are cleaned up
            }
          fi
          echo "✅ YAML validation complete"

      - name: Validate JSON files
        run: |
          echo "🔍 Validating JSON files..."
          find . -type f -name "*.json" \
            ! -path "./.git/*" \
            ! -path "./node_modules/*" \
            ! -path "./vendor/*" \
            -exec python3 -m json.tool {} \; > /dev/null || {
              echo "❌ JSON validation failed"
              exit 1
            }
          echo "✅ JSON validation passed"

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Run markdownlint
        run: |
          echo "🔍 Running markdownlint..."
          # Create relaxed config
          cat > /tmp/.markdownlint.json << 'EOF'
          {
            "default": true,
            "MD013": false,
            "MD033": false,
            "MD041": false,
            "MD024": { "siblings_only": true }
          }
          EOF
          markdownlint --config /tmp/.markdownlint.json "**/*.md" \
            --ignore node_modules \
            --ignore vendor \
            --ignore .git || {
              echo "⚠️  Markdown lint found issues (non-blocking)"
              # TODO: Make blocking once markdown files are cleaned up
            }
          echo "✅ Markdown lint complete"

  conventional-commits:
    name: Conventional Commits Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install commitlint
        run: |
          npm install -g @commitlint/cli @commitlint/config-conventional

      - name: Create commitlint config
        run: |
          cat > /tmp/commitlint.config.js << 'EOF'
          module.exports = {
            extends: ['@commitlint/config-conventional'],
            rules: {
              'type-enum': [
                2,
                'always',
                [
                  'feat',
                  'fix',
                  'docs',
                  'style',
                  'refactor',
                  'perf',
                  'test',
                  'chore',
                  'ci',
                  'build',
                  'revert'
                ]
              ],
              'subject-case': [0],
              'body-max-line-length': [0]
            }
          };
          EOF

      - name: Check commit messages
        run: |
          echo "🔍 Checking commit messages for conventional format..."
          commitlint --config /tmp/commitlint.config.js --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} || {
            echo ""
            echo "❌ Commit messages must follow Conventional Commits format:"
            echo "   <type>: <description>"
            echo ""
            echo "   Types: feat, fix, docs, style, refactor, perf, test, chore, ci, build, revert"
            echo ""
            echo "   Examples:"
            echo "     feat: add new ATOM logging feature"
            echo "     fix: resolve broken link in README"
            echo "     docs: update installation guide"
            exit 1
          }
          echo "✅ All commit messages follow conventional format"

  branch-name:
    name: Branch Name Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - name: Check branch name format
        run: |
          branch="${{ github.head_ref }}"
          echo "🔍 Checking branch name: $branch"

          # Valid patterns
          valid_patterns="^(feat|fix|docs|style|refactor|perf|test|chore|ci|build|hotfix|release|copilot)/"

          if [[ "$branch" =~ $valid_patterns ]]; then
            echo "✅ Branch name follows convention"
          else
            echo "❌ Branch name must follow pattern: <type>/<description>"
            echo ""
            echo "   Valid types: feat, fix, docs, style, refactor, perf, test, chore, ci, build, hotfix, release, copilot"
            echo ""
            echo "   Examples:"
            echo "     feat/add-atom-logging"
            echo "     fix/resolve-broken-links"
            echo "     docs/update-readme"
            exit 1
          fi

  large-files:
    name: Large File Detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Check for large files
        run: |
          echo "🔍 Checking for large files (>500KB)..."
          # Find files larger than 500KB
          large_files=$(find . -type f -size +500k \
            ! -path "./.git/*" \
            ! -path "./node_modules/*" \
            ! -path "./vendor/*" \
            ! -name "*.zip" \
            ! -name "*.tar.gz" \
            ! -name "*.iso" 2>/dev/null || true)

          if [ -n "$large_files" ]; then
            echo "⚠️  Large files detected:"
            echo "$large_files" | while read -r file; do
              size=$(du -h "$file" | cut -f1)
              echo "  $size - $file"
            done
            echo ""
            echo "Consider using Git LFS for large files or adding to .gitignore"
          else
            echo "✅ No unexpectedly large files found"
          fi

  secrets-detection:
    name: Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Run detect-secrets
        run: |
          echo "🔍 Scanning for secrets..."
          detect-secrets scan --all-files --exclude-files '\.git/.*' \
            --exclude-files 'node_modules/.*' \
            --exclude-files 'vendor/.*' \
            --exclude-files '.*\.lock$' > /tmp/secrets-baseline.json

          # Check if any secrets were found
          secrets_count=$(python3 -c "import json; print(sum(len(v) for v in json.load(open('/tmp/secrets-baseline.json'))['results'].values()))")
          if [ "$secrets_count" -gt 0 ]; then
            echo "⚠️  Potential secrets detected: $secrets_count"
            detect-secrets scan --all-files --exclude-files '\.git/.*' \
              --exclude-files 'node_modules/.*' \
              --exclude-files 'vendor/.*' \
              --exclude-files '.*\.lock$' 2>&1 || true
            echo ""
            echo "Review the above and add false positives to .secrets.baseline"
          else
            echo "✅ No secrets detected"
          fi
