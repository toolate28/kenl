name: Validate Documentation and Scripts

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# ATOM-CI-20251116-001: Fix CI validation failures and harden link checking
jobs:
  validate-links:
    name: Validate Markdown Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run repository link validator
        run: |
          bash ./scripts/validate-links.sh

  shellcheck:
    name: ShellCheck (Bash Scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run ShellCheck
        run: shellcheck -f tty -S warning ./scripts/*.sh

  powershell-analysis:
    name: PSScriptAnalyzer (PowerShell)
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup PowerShell
        if: matrix.runner == 'ubuntu-latest'
        uses: milliewalky/setup-pwsh@111b66da66b9e4c068052ed1ae34fcbeb9adcf36 # v1
        with:
          tag: 'v7.5.0'
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          # Ensure NuGet provider is available non-interactively and trust PSGallery
          Install-PackageProvider -Name NuGet -Force -Scope CurrentUser -ErrorAction Stop
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Name PSGallery -SourceLocation 'https://www.powershellgallery.com/api/v2' -InstallationPolicy Trusted
          } else {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          }
          # Install module non-interactively
          Install-Module -Name PSScriptAnalyzer -Force -AllowClobber -Scope CurrentUser -ErrorAction Stop
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $settings = 'PSScriptAnalyzerSettings.psd1'
          $exclude = @('vendor','node_modules','.git')
          if (Test-Path $settings) {
            $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings $settings -ExcludePath $exclude
          } else {
            Write-Host "PSScriptAnalyzer settings not found; running with defaults"
            $results = Invoke-ScriptAnalyzer -Path . -Recurse -ExcludePath $exclude
          }
          if ($results.Count -gt 0) {
            $results | Format-Table -AutoSize
            $errors = $results | Where-Object { $_.Severity -eq 'Error' }
            if ($errors.Count -gt 0) {
              Write-Error ("PSScriptAnalyzer found {0} errors" -f $errors.Count)
              exit 1
            }
            Write-Host ("PSScriptAnalyzer found {0} warnings" -f $results.Count)
          } else {
            Write-Host "✓ No PSScriptAnalyzer issues found"
          }
