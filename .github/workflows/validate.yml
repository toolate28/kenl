name: Validate Documentation and Scripts

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-links:
    name: Validate Markdown Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up bash dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run repository link validator
        run: |
          bash ./scripts/validate-links.sh

  shellcheck:
    name: ShellCheck (Bash Scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run ShellCheck
        run: shellcheck -f tty -S warning ./scripts/*.sh

  powershell-analysis:
    name: PSScriptAnalyzer (PowerShell)
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Setup PowerShell
        if: matrix.runner == 'ubuntu-latest'
        uses: actions/setup-powershell@v1
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $settings = 'PSScriptAnalyzerSettings.psd1'
          $exclude = @('vendor','node_modules','.git')
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings $settings
          if ($results.Count -gt 0) {
            $results | Format-Table -AutoSize
            # Treat only Error severity as failing CI; emit warnings otherwise
            $errors = $results | Where-Object { $_.Severity -eq 'Error' }
            if ($errors.Count -gt 0) { 
              Write-Error ("PSScriptAnalyzer found {0} errors" -f $errors.Count)
              exit 1 
            }
            Write-Host ("PSScriptAnalyzer found {0} warnings" -f $results.Count)
          } else {
            Write-Host "✓ No PSScriptAnalyzer issues found"
          }
